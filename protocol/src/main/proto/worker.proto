syntax = "proto3";

package minik8s.worker.v1;

option java_package = "com.minik8s.protocol.worker.v1";
option java_multiple_files = true;
option java_outer_classname = "WorkerProtocol";

service WorkerService {
  rpc StartReplica(StartReplicaRequest) returns (OperationReply);
  rpc StopReplica(ReplicaRequest) returns (OperationReply);
  rpc RemoveReplica(ReplicaRequest) returns (OperationReply);
  rpc GetReplicaStatus(ReplicaRequest) returns (ReplicaStatusReply);
  rpc ListReplicas(ListReplicasRequest) returns (ListReplicasReply);
  rpc GetWorkerStatus(WorkerStatusRequest) returns (WorkerStatusReply);
}

message ResourceRequest {
  int64 cpu_millis = 1;
  int64 memory_bytes = 2;
}

message StartReplicaRequest {
  string replica_id = 1;
  string deployment_id = 2;
  string worker_id = 3;
  string image = 4;
  ResourceRequest resources = 5;
}

message ReplicaRequest {
  string replica_id = 1;
  string worker_id = 2;
}

message OperationReply {
  bool accepted = 1;
  string replica_id = 2;
  string message = 3;
}

message ListReplicasRequest {
  string worker_id = 1;
}

message ReplicaStatusReply {
  string replica_id = 1;
  string deployment_id = 2;
  string worker_id = 3;
  string image = 4;
  string status = 5;
  string message = 6;
  int64 updated_at_epoch_millis = 7;
}

message ListReplicasReply {
  repeated ReplicaStatusReply replicas = 1;
}

message WorkerStatusRequest {
  string worker_id = 1;
}

message WorkerStatusReply {
  string worker_id = 1;
  string host = 2;
  int32 grpc_port = 3;
  int64 total_cpu_millis = 4;
  int64 total_memory_bytes = 5;
  int64 available_cpu_millis = 6;
  int64 available_memory_bytes = 7;
  int32 running_replicas = 8;
  int64 observed_at_epoch_millis = 9;
}
